[package]
name = "solodraw-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "solodraw-gtk"
path = "src/main.rs"

[dependencies]
solodraw-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_6"] }
pangocairo = "0.22"
cairo-rs = { version = "0.22", features = ["png", "svg"] }
serde_json = "1"
